# ==============================================================================
# Window rules
# Rules combine in order, with later values overriding earlier ones.
# https://docs.noctalia.dev/umbriel/window-rules/
#

# Blur windows over the cached wallpaper blur.
[[window_rule]]
blur = true

# Picture-in-Picture
[[window_rule]]
match.title = '^([Pp]icture[-\\s]?[Ii]n[-\\s]?[Pp]icture).*$'
default_floating = true
default_pinned = true
default_floating_size = { width = 0.25, height = 0.25 }
default_position = { x = 20, y = 20, anchor = 'bottom_right' }

# Gaming
[[window_rule]]
match.content_type = 'game'
default_output = 'HDMI-A-1'

[[window_rule]]
match.xdg_tag = '^.*game.*$'
default_output = 'HDMI-A-1'
default_fullscreen = true

[[window_rule]]
match.app_id = '^(steam_app.*|gamescope)$'
default_output = 'HDMI-A-1'
confine_pointer = true

[[window_rule]]
match.app_id = '^steam$'
match.title = '^(Friends List|Steam Settings)$'
default_floating = true

[[window_rule]]
match.app_id = '^steam$'
# default_floating = true
default_output = 'HDMI-A-1'

[[window_rule]]
match.app_id = '^steam$'
match.title = '^Launching\\.{3}$'
default_floating = true
default_position = { x = 0, y = 0, anchor = 'center' }
default_output = 'HDMI-A-1'

[[window_rule]]
match.app_id = '^steam_app.*$'
match.title = '^$'
default_floating = true
default_position = { x = 0, y = 0, anchor = 'center' }
default_output = 'HDMI-A-1'

# Apps
[[window_rule]]
match.app_id = '^.*\\.exe$'
default_floating = true
default_output = 'eDP-1'
default_position = { x = 0, y = 0, anchor = 'center' }

[[window_rule]]
match.app_id = '^.*[Ll]auncher.*$'
default_floating = true
default_output = 'eDP-1'

[[window_rule]]
match.app_id = '^(vesktop|discord)$'
default_output = 'eDP-1'

[[window_rule]]
match.app_id = '^.*[Cc]alc.*$'
default_floating = true
default_floating_size = { width = 0.25, height = 0.43 }

[[window_rule]]
match.app_id = '^org.kde.keditfiletype$'
default_floating = true

[[window_rule]]
match.app_id = '^org.kde.ark$'
default_floating = true
default_floating_size = { width = 0.40, height = 0.40 }

[[window_rule]]
match.app_id = '^.*swash$'
match.title = '^Swash$'
default_floating = true
default_floating_size = { width = 0.35, height = 0.35 }

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1100, height = 750 }

# Modals and Dialogs
[[window_rule]]
match.title = '^(Open|Authentication Required|Add Folder to Workspace|Choose Files|Save As|Confirm to replace files|File Operation Progress)$'
default_floating = true

[[window_rule]]
match.app_id = '^([Xx]dg-desktop-portal-gtk)$'
default_floating = true

[[window_rule]]
match.title = '^(File Upload|Choose wallpaper|Library).*$'
default_floating = true

[[window_rule]]
match.app_id = '^.*dialog.*$'
default_floating = true

[[window_rule]]
match.title = '^.*dialog.*$'
default_floating = true

[[window_rule]]
match.app_id = '^hyprland-share-picker$'
default_floating = true

# Thunar
# Main window rule
[[window_rule]]
match.app_id = '^thunar$'
default_floating = true
# default_floating_size = { width = 0.47, height = 0.55 }

# Thunar transient dialogs (with parent)
[[window_rule]]
match.app_id = '^thunar$'
match.is_dialog = true
default_floating = true

# Thunar non-transient file operations & progress windows
[[window_rule]]
match.app_id = '^thunar$'
match.title = '^([Ff]ile [Oo]peration [Pp]rogress|[Cc]opying files|[Mm]oving files|[Dd]eleting files|[Cc]reating directories|[Cc]reating files|[Cc]reating symbolic links|[Cc]ollecting files|[Cc]alculating|[Cc]ancelling|[Aa]borting operation|[Ee]mptying the trash|[Rr]estoring files|[Vv]erifying file contents|[Pp]reparing|[Rr]esuming|[Ll]oading folder contents|[Pp]lease wait).*$'
default_floating = true

# Float Utility Windows
[[window_rule]]
match.app_id = '^(kvantummanager|qt[56]ct|nwg-look|blueman-manager|nm-applet|nm-connection-editor)$'
default_floating = true

[[window_rule]]
match.title = '^(Winetricks.*|Protontricks.*)$'
default_floating = true

# Sized Float Apps
[[window_rule]]
match.app_id = '^org.pulseaudio.pavucontrol$'
default_floating = true
default_floating_size_px = { width = 1160, height = 811 }
default_position = { x = 0, y = 0, anchor = 'center' }

[[window_rule]]
match.app_id = '^mpv$'
default_floating = true
default_floating_size_px = { width = 1280, height = 720 }
default_position = { x = 0, y = 0, anchor = 'center' }

[[window_rule]]
match.app_id = '^org.pwmt.zathura$'
default_floating = true
default_position = { x = 0, y = 0, anchor = 'center' }

[[window_rule]]
match.app_id = '^com.interversehq.qView$'
default_floating = true
default_floating_size_px = { width = 1000, height = 700 }
default_position = { x = 0, y = 0, anchor = 'center' }

# AB Download Manager
[[window_rule]]
match.app_id = '^com-abdownloadmanager-desktop-AppKt$'
match.title = '^AB Download Manager$'
default_floating = true
default_position = { x = 0, y = 0, anchor = 'center' }
default_floating_size = { width = 0.50, height = 0.90 }

[[window_rule]]
match.app_id = '^com-abdownloadmanager-desktop-AppKt$'
default_floating = true

# Zoom Workplace
[[window_rule]]
match.app_id = '^([Zz]oom|[Zz]oom [Ww]orkplace)$'
default_floating = true

[[window_rule]]
match.app_id = '^([Zz]oom|[Zz]oom [Ww]orkplace)$'
match.title = '^(as_toolbar|annotate_toolbar|toolbar_window|cpt_share_buffer.*)$'
default_floating = true
default_pinned = true
default_focused = false
shadow = false

[[window_rule]]
match.app_id = '^([Zz]oom|[Zz]oom [Ww]orkplace)$'
match.title = '.*(Annotate|annotation|Draw).*'
default_floating = true
default_pinned = true
default_focused = false

[[window_rule]]
match.app_id = '^([Zz]oom|[Zz]oom [Ww]orkplace)$'
match.title = '^(zoom_linux_float_video_window|floating_video_window)$'
default_floating = true
default_pinned = true
default_focused = false

[[window_rule]]
match.app_id = '^([Zz]oom|[Zz]oom [Ww]orkplace)$'
match.title = '^(ZPDrawingBufferWindow|notification_window)$'
default_floating = true
default_focused = false
shadow = false
default_pinned = true
