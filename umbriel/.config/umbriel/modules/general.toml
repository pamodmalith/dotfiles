# ==============================================================================
# General
# https://docs.noctalia.dev/umbriel/configuration/#general
#
[general]
show_cheatsheet = false
autostart = ["noctalia", "xhost +SI:localuser:root"]
xwayland = true
# Sharp X11 apps and games on scaled outputs; they see physical resolutions.
xwayland_native_resolution = true
xwayland_xsettings = true
# Modal dialogs hang on their parent window and follow it.
attach_modal_dialogs = true

# ==============================================================================
# Environment variables
# Ported from uwsm/.config/uwsm/env
#
[environment]
BROWSER = "firefox"
QT_QPA_PLATFORM = "wayland;xcb"
QT_QPA_PLATFORMTHEME = "qt6ct"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
# Enforce XCompose fallback rules across GTK and Qt frameworks
GTK_IM_MODULE = "xim"
QT_IM_MODULE = "xim"
XCOMPOSEFILE = "/home/pamod/.XCompose"

# ==============================================================================
# Lid events
# Remove the laptop panel from the desktop while the lid is closed, then
# restore it when the lid opens.
# https://docs.noctalia.dev/umbriel/configuration/#events
#
[events]
lid_close = "umbriel msg output-disable eDP-1"
lid_open = "umbriel msg output-enable eDP-1"

