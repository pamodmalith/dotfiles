# ==============================================================================
# Input
# Ported from input.lua, misc.lua, and uwsm/env
# https://docs.noctalia.dev/umbriel/input/
#
[input]
middle_click_paste = false

[input.mouse]
accel_profile = "flat"

[input.touchpad]
accel_profile = "flat"
natural_scroll = true
tap = true

[input.keyboard]
options = "compose:ralt"
numlock_toggle = true

[input.cursor]
theme = "Bibata-Modern-Ice"
size = 24

[input.focus]
# follows_mouse = true
hover_raises = false # Hover focuses only; clicks and keybinds raise.