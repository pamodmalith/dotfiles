# Umbriel starting configuration
#
# Copy this file to ~/.config/umbriel/config.toml. Most changes apply when the
# file is saved. Check edits with `umbriel config validate`.
#
# Complete reference: https://docs.noctalia.dev/umbriel/
#
# Commented settings below are examples, not built-in defaults.

# ==============================================================================
# Includes - Modular configuration
# All modules are in the modules/ directory
[include]
files = [
  "modules/general.toml",
  "modules/outputs.toml",
  "modules/appearance.toml",
  "modules/effects.toml",
  "modules/input.toml",
  "modules/keybinds.toml",
  "modules/layout.toml",
  "modules/workspaces.toml",
  "modules/window-rules.toml",
  "modules/layer-rules.toml",
  "modules/hot-corners.toml",
]

[include.optional]
files = ["noctalia.toml"]
